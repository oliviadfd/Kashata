<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ভিডিও দেখুন | Continue</title>
<meta name="description" content="ভিডিও গুলো দেখতে CONTINUE বোতামে ক্লিক করুন।" />
<meta property="og:title" content="ভিডিও দেখুন | Continue" />
<meta property="og:description" content="ভিডিও গুলো দেখতে CONTINUE বোতামে ক্লিক করুন।" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="video-page">
  <div class="video-content">

    <div class="video-cover">
      <img src="girls-collage.JPG" width="1536" height="1024" alt="সূর্যাস্তে সবুজ পাহাড় ও নীল সমুদ্র" fetchpriority="high" />
      <div class="cover-play" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
      </div>
      <span class="cover-label"><span></span> VIDEO</span>
    </div>

    <section class="video-description" lang="bn">
      <span class="section-label">WATCH &amp; EXPLORE</span>
      <h1 class="animated-title">
        <span>ভিডিও গুলো দেখতে</span>
        <span>continue button</span>
        <span>click করুন</span>
      </h1>
      <div class="continue-area">
        <button type="button" class="continue-button continue-button-size" id="continueBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
          CONTINUE
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
        </button>
      </div>
    </section>

  </div>
</main>
<script src="script.js"></script>
</body>
</html>
